<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader & Media Viewer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="logo">MediaPulse</div>
            <ul class="nav-links">
                <li class="active" data-target="search-view">Search & Download</li>
                <li data-target="queue-view">Download Queue <span id="queue-badge" class="badge">0</span></li>
                <li data-target="files-view">File Manager</li>
            </ul>
            <div class="upload-section">
                <label for="local-upload" class="upload-btn">Upload Local File</label>
                <input type="file" id="local-upload" accept="video/mp4,audio/mp3,audio/mpeg" multiple hidden>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Search View -->
            <section id="search-view" class="view active">
                <header class="search-header">
                    <input type="text" id="search-input" placeholder="Search YouTube videos or paste URL...">
                    <button id="search-btn" class="btn primary">Search</button>
                </header>
                <div class="results-container" id="results-list">
                    <!-- Search results will be injected here -->
                    <div class="empty-state">Enter a search term to find videos.</div>
                </div>
            </section>

            <!-- Queue View -->
            <section id="queue-view" class="view">
                <header class="view-header">
                    <h2>Download Queue</h2>
                    <button id="process-queue-btn" class="btn primary">Start Processing</button>
                </header>
                <div class="queue-container" id="queue-list">
                    <div class="empty-state">Queue is empty.</div>
                </div>
            </section>

            <!-- File Manager View -->
            <section id="files-view" class="view">
                <header class="view-header">
                    <h2>My Collection</h2>
                </header>
                <div class="files-container" id="files-list">
                    <div class="empty-state">No downloaded files yet.</div>
                </div>
            </section>
        </main>

        <!-- Video Player Modal -->
        <div id="player-modal" class="modal hidden">
            <div class="modal-content">
                <button class="close-btn" id="close-player">&times;</button>
                <div class="player-container">
                    <video id="media-player" controls></video>
                </div>
                <h3 id="now-playing-title">Video Title</h3>
            </div>
        </div>

        <!-- Download Options Modal -->
        <div id="download-modal" class="modal hidden">
            <div class="modal-content small-modal">
                <button class="close-btn" id="close-download-modal">&times;</button>
                <h3>Download Options</h3>
                <div class="form-group">
                    <label>Format</label>
                    <select id="format-select">
                        <option value="mp4">Video (.mp4)</option>
                        <option value="mp3">Audio (.mp3)</option>
                    </select>
                </div>
                <div class="form-group" id="quality-group">
                    <label>Quality</label>
                    <select id="quality-select">
                        <option value="1080">1080p</option>
                        <option value="720">720p</option>
                        <option value="480">480p</option>
                        <option value="360">360p</option>
                    </select>
                </div>
                <button id="add-to-queue-btn" class="btn primary full-width">Add to Queue</button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>

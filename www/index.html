<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MediaPulse</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Top Glass Header -->
        <header class="glass-header">
            <div class="logo">MediaPulse</div>
            <div class="upload-section">
                <label for="local-upload" class="upload-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </label>
                <input type="file" id="local-upload" accept="video/mp4,audio/mp3,audio/mpeg" multiple hidden>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Search View -->
            <section id="search-view" class="view active">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search YouTube...">
                    <button id="search-btn" class="btn primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    </button>
                </div>
                <div class="results-container" id="results-list">
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <p>Search for music or videos</p>
                    </div>
                </div>
            </section>

            <!-- Queue View -->
            <section id="queue-view" class="view">
                <div class="view-header">
                    <h2>Downloads</h2>
                    <button id="process-queue-btn" class="btn primary small">Process</button>
                </div>
                <div class="queue-container" id="queue-list">
                    <div class="empty-state">
                        <div class="empty-icon">📥</div>
                        <p>Queue is empty</p>
                    </div>
                </div>
            </section>

            <!-- File Manager View -->
            <section id="files-view" class="view">
                <div class="view-header">
                    <h2>Collection</h2>
                </div>
                <div class="files-container" id="files-list">
                    <div class="empty-state">
                        <div class="empty-icon">🎵</div>
                        <p>No media downloaded yet</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Tab Bar -->
        <nav class="bottom-tab-bar">
            <ul class="nav-links">
                <li class="active" data-target="search-view">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <span>Search</span>
                </li>
                <li data-target="queue-view">
                    <div class="icon-container">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <span id="queue-badge" class="badge">0</span>
                    </div>
                    <span>Queue</span>
                </li>
                <li data-target="files-view">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span>Files</span>
                </li>
            </ul>
        </nav>


        <!-- Download Options Modal -->
        <div id="download-modal" class="modal hidden">
            <div class="modal-content glass-panel small-modal">
                <button class="close-btn" id="close-download-modal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <h3>Download Options</h3>
                <div class="form-group">
                    <label>Format</label>
                    <select id="format-select">
                        <option value="mp4">Video (.mp4)</option>
                        <option value="mp3">Audio (.mp3)</option>
                    </select>
                </div>
                <div class="form-group" id="quality-group">
                    <label>Quality</label>
                    <select id="quality-select">
                        <option value="1080">1080p</option>
                        <option value="720">720p (HD)</option>
                        <option value="480">480p</option>
                        <option value="360">360p</option>
                    </select>
                </div>
                <button id="add-to-queue-btn" class="btn primary full-width">Add to Queue</button>
            </div>
        </div>
    </div>
    
    <script src="capacitor.js"></script>
    <script src="bundle.js"></script>
</body>
</html>

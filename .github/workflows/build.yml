name: Build iOS IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rm -rf node_modules
      - run: npm install
      - run: npx cap sync ios
      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build CONFIGURATION_BUILD_DIR=$(PWD)/build
          mkdir -p build/Payload
          cp -r build/App.app build/Payload/
          cd build
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MediaPulse-IPA
          path: ios/App/build/app.ipa
